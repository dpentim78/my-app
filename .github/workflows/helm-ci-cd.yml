name: Helm CI/CD for Home Lab

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.8.0

    - name: Lint Helm Chart
      run: helm lint helm-charts/myapp

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      
    - name: Configure kubectl
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
        chmod 600 kubeconfig
        echo "KUBECONFIG=kubeconfig" >> $GITHUB_ENV

    - name: Debug kubeconfig
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      run: |
        echo "Cluster server in kubeconfig:"
        kubectl --kubeconfig=kubeconfig config view --minify -o jsonpath='{.clusters[0].cluster.server}'
        echo "\n---"
        echo "Current context:"
        kubectl --kubeconfig=kubeconfig config current-context || echo "No current context set"

    - name: Verify kubectl configuration
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      run: |
        if ! kubectl --kubeconfig=kubeconfig get nodes --insecure-skip-tls-verify; then
          echo "Error: Unable to connect to the cluster. The cluster may not be accessible from GitHub Actions."
          echo "If this is a local cluster, you may need to set up a VPN or use a self-hosted runner."
          exit 1
        else
          echo "Successfully connected to the cluster"
        fi

    - name: Deploy to Home Lab Kubernetes
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      run: |
        if ! helm --kubeconfig=kubeconfig upgrade --install myapp helm-charts/myapp --namespace default --set image.repository=dpentim78/oteemo-app --debug --insecure-skip-tls-verify; then
          echo "Error: Helm deployment failed. Here's some debug information:"
          helm --kubeconfig=kubeconfig ls --all-namespaces --insecure-skip-tls-verify
          kubectl --kubeconfig=kubeconfig get pods --all-namespaces --insecure-skip-tls-verify
          exit 1
        fi
