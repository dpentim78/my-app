name: Helm CI/CD for Home Lab

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.8.0

    - name: Lint Helm Chart
      run: helm lint helm-charts/myapp

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      
    - name: Configure kubectl
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
        chmod 600 kubeconfig
        echo "KUBECONFIG=kubeconfig" >> $GITHUB_ENV

    - name: Debug kubeconfig
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      run: |
        echo "Kubeconfig contents (sensitive information redacted):"
        sed 's/\(server: https:\/\/\)[^:]*\(.*\)/\1REDACTED\2/' kubeconfig
        echo "---"
        echo "Contexts in kubeconfig:"
        kubectl --kubeconfig=kubeconfig config get-contexts
        echo "---"
        echo "Current context:"
        kubectl --kubeconfig=kubeconfig config current-context || echo "No current context set"

    - name: Verify kubectl configuration
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      run: |
        if ! kubectl --kubeconfig=kubeconfig get nodes; then
          echo "Error: Unable to connect to the cluster. Here's some debug information:"
          kubectl --kubeconfig=kubeconfig config view
          exit 1
        else
          echo "Successfully connected to the cluster"
        fi

    - name: Deploy to Home Lab Kubernetes
      if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      run: |
        if ! helm --kubeconfig=kubeconfig upgrade --install myapp helm-charts/myapp --namespace default --set image.repository=dpentim78/oteemo-app --debug; then
          echo "Error: Helm deployment failed. Here's some debug information:"
          helm --kubeconfig=kubeconfig ls --all-namespaces
          kubectl --kubeconfig=kubeconfig get pods --all-namespaces
          exit 1
        fi
