replicaCount: 1
image:
  repository: dpentim78/my-app
  pullPolicy: IfNotPresent
  tag: "1.0.0"
serviceAccount:
  create: false
  annotations: {}
  name: "default"
service:
  type: ClusterIP
  port: 3000
ingress:
  enabled: true
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
