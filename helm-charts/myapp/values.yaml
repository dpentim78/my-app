replicaCount: 1
image:
  repository: dpentim78/my-app
  pullPolicy: IfNotPresent
  tag: "1.0.0"
serviceAccount:
  create: false
  annotations: {}
  name: "default"
service:
  type: ClusterIP
  port: 3000
ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
